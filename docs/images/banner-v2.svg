<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0e1420"/>
      <stop offset="55%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#060a10"/>
    </linearGradient>

    <!-- Atmospheric mist glow -->
    <radialGradient id="mist" cx="58%" cy="38%" r="52%">
      <stop offset="0%"  stop-color="#2a3d60" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1a2a45" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0a0f1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm glow right -->
    <radialGradient id="warm-right" cx="92%" cy="60%" r="35%">
      <stop offset="0%"  stop-color="#3b2060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b2060" stop-opacity="0"/>
    </radialGradient>

    <!-- Album art: cosmic orb bg -->
    <radialGradient id="orb-bg" cx="42%" cy="38%" r="60%">
      <stop offset="0%"  stop-color="#1c1c50"/>
      <stop offset="60%" stop-color="#0d0d28"/>
      <stop offset="100%" stop-color="#060612"/>
    </radialGradient>

    <!-- Play button -->
    <radialGradient id="play-btn" cx="40%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#9d6ff7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>

    <!-- Progress fill -->
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Topbar gradient -->
    <linearGradient id="topbar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#161824" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#12141f" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Controls bar -->
    <linearGradient id="ctrl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1c1f30" stop-opacity="0.93"/>
      <stop offset="100%" stop-color="#151727" stop-opacity="0.93"/>
    </linearGradient>

    <!-- Star glow -->
    <filter id="sglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Orb soft glow -->
    <filter id="orb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip: rounded banner -->
    <clipPath id="banner-clip">
      <rect width="1280" height="360" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">

    <!-- ═══════════════════════════════════════ -->
    <!-- BACKGROUND: Atmospheric Mountain Scene  -->
    <!-- ═══════════════════════════════════════ -->
    <rect width="1280" height="360" fill="url(#sky)"/>

    <!-- Far mountains -->
    <path d="M0,260 L90,195 L170,230 L270,162 L370,208 L450,148 L540,192 L620,155 L710,198 L800,155 L890,195 L980,162 L1070,200 L1160,170 L1250,198 L1280,185 L1280,360 L0,360Z"
          fill="#1c2236" opacity="0.7"/>
    <!-- Mid mountains -->
    <path d="M0,295 L120,245 L230,278 L330,228 L450,265 L530,218 L640,258 L740,225 L840,262 L940,232 L1040,268 L1140,240 L1240,272 L1280,255 L1280,360 L0,360Z"
          fill="#111827" opacity="0.85"/>
    <!-- Forest treeline -->
    <path d="M0,318 L80,305 L160,312 L240,300 L360,310 L480,298 L600,308 L720,296 L840,307 L960,295 L1080,308 L1200,298 L1280,306 L1280,360 L0,360Z"
          fill="#0a0d14"/>
    <!-- Ground -->
    <rect x="0" y="338" width="1280" height="22" fill="#070a10"/>

    <!-- Atmospheric glow overlays -->
    <rect width="1280" height="360" fill="url(#mist)"/>
    <rect width="1280" height="360" fill="url(#warm-right)"/>

    <!-- Stars -->
    <g filter="url(#sglow)">
      <circle cx="95"  cy="28"  r="1.0" fill="#fff" opacity="0.70"/>
      <circle cx="188" cy="48"  r="0.8" fill="#fff" opacity="0.55"/>
      <circle cx="310" cy="22"  r="1.1" fill="#fff" opacity="0.65"/>
      <circle cx="445" cy="38"  r="0.9" fill="#fff" opacity="0.60"/>
      <circle cx="560" cy="18"  r="1.2" fill="#9bd9dc" opacity="0.60"/>
      <circle cx="680" cy="42"  r="0.8" fill="#fff" opacity="0.55"/>
      <circle cx="820" cy="24"  r="1.0" fill="#fff" opacity="0.70"/>
      <circle cx="940" cy="50"  r="0.9" fill="#c5b1e7" opacity="0.60"/>
      <circle cx="1060" cy="28" r="1.1" fill="#fff" opacity="0.65"/>
      <circle cx="1180" cy="44" r="0.8" fill="#fff" opacity="0.55"/>
      <circle cx="1245" cy="20" r="1.0" fill="#fff" opacity="0.65"/>
      <circle cx="760"  cy="62" r="0.7" fill="#fff" opacity="0.45"/>
      <circle cx="1120" cy="60" r="0.9" fill="#fff" opacity="0.50"/>
    </g>

    <!-- Dark readability veil -->
    <rect width="1280" height="360" fill="#000000" opacity="0.30"/>


    <!-- ═══════════════════════════════════════ -->
    <!-- TAB BAR                                 -->
    <!-- ═══════════════════════════════════════ -->
    <rect width="1280" height="48" fill="url(#topbar-bg)"/>
    <rect x="0" y="47" width="1280" height="1" fill="#ffffff" fill-opacity="0.07"/>

    <!-- Traffic lights -->
    <circle cx="22" cy="24" r="6.5" fill="#ff5f57"/>
    <circle cx="42" cy="24" r="6.5" fill="#febc2e"/>
    <circle cx="62" cy="24" r="6.5" fill="#28c840"/>

    <!-- Active tab pill -->
    <rect x="90" y="11" width="192" height="26" rx="13" fill="#252737"/>
    <!-- Active dot -->
    <circle cx="106" cy="24" r="4" fill="#4ade80"/>
    <text x="118" y="28.5"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="12.5" font-weight="600" fill="#ffffff">Live Interactive Player</text>

    <!-- Inactive tabs -->
    <text x="296" y="28.5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#6b7280">Album Carousel</text>
    <text x="426" y="28.5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#6b7280">Cinema Lyrics</text>
    <text x="544" y="28.5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#6b7280">Cover + Lyrics</text>
    <text x="662" y="28.5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#6b7280">Music Discovery</text>


    <!-- ═══════════════════════════════════════ -->
    <!-- IN-APP TOPBAR (brand + badge + time)    -->
    <!-- ═══════════════════════════════════════ -->
    <!-- Brand mark -->
    <text x="20" y="76" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" font-weight="700" fill="#c5b1e7">a</text>
    <text x="33" y="76" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#ffffff">Sonoglow</text>

    <!-- YouTube Music pill (centered) -->
    <rect x="548" y="58" width="184" height="24" rx="12"
          fill="#ffffff" fill-opacity="0.07"
          stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="568" y="75" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="11.5" fill="#d1d5db">YouTube Music · Lossless Stream</text>

    <!-- Clock -->
    <text x="1215" y="76" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="12.5" font-weight="500" fill="#9ca3af" text-anchor="end">09:18 AM</text>


    <!-- ═══════════════════════════════════════ -->
    <!-- ALBUM ART                               -->
    <!-- ═══════════════════════════════════════ -->
    <g transform="translate(20, 92)">
      <!-- Art box shadow -->
      <rect x="2" y="2" width="154" height="154" rx="11" fill="#000000" opacity="0.5"/>
      <!-- Art bg -->
      <rect width="154" height="154" rx="11" fill="url(#orb-bg)"/>

      <!-- Planet body -->
      <circle cx="77" cy="74" r="44" fill="#08082a"/>
      <!-- Planet shading -->
      <circle cx="77" cy="74" r="40" fill="#0d0d30"/>
      <ellipse cx="70" cy="64" rx="22" ry="16" fill="#1a1a50" opacity="0.5"/>
      <!-- Inner star specks on planet -->
      <circle cx="60" cy="58" r="0.9" fill="#fff" opacity="0.7"/>
      <circle cx="92" cy="50" r="0.8" fill="#fff" opacity="0.5"/>
      <circle cx="102" cy="82" r="1"   fill="#fff" opacity="0.6"/>
      <circle cx="58" cy="88" r="0.7"  fill="#fff" opacity="0.4"/>

      <!-- Orbital rings (with filter glow) -->
      <g filter="url(#orb-glow)">
        <!-- Cyan ring -->
        <ellipse cx="77" cy="76" rx="60" ry="21"
                 fill="none" stroke="#00e5ff" stroke-width="2.2"
                 stroke-opacity="0.88" transform="rotate(-22,77,76)"/>
        <!-- Purple ring -->
        <ellipse cx="77" cy="76" rx="52" ry="19"
                 fill="none" stroke="#a855f7" stroke-width="2.2"
                 stroke-opacity="0.88" transform="rotate(28,77,76)"/>
        <!-- Pink ring -->
        <ellipse cx="77" cy="76" rx="42" ry="14"
                 fill="none" stroke="#ec4899" stroke-width="1.8"
                 stroke-opacity="0.75" transform="rotate(-12,77,76)"/>
      </g>

      <!-- Track info below art -->
      <text x="0" y="172" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="12.5" font-weight="700" fill="#ffffff">Sonoglow (Celestial Atm...</text>
      <text x="0" y="188" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="11" fill="#9ca3af">Chvrches · Spatial Audio</text>
    </g>


    <!-- ═══════════════════════════════════════ -->
    <!-- LYRICS SECTION                          -->
    <!-- ═══════════════════════════════════════ -->
    <g transform="translate(200, 90)">
      <!-- Previous lyric -->
      <text x="0" y="50" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="15.5" fill="#4b5563">Held in the gravity of forgotten skies...</text>

      <!-- Current lyric (active, bright) -->
      <text x="0" y="88" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="23" font-weight="700" fill="#ffffff">We chase the Sonoglow into the deep</text>
      <text x="0" y="118" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="23" font-weight="700" fill="#ffffff">night...</text>

      <!-- Next lyric -->
      <text x="0" y="152" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="15.5" fill="#4b5563">Echoes of soundwaves resonating forever...</text>

      <!-- Live synced badge -->
      <text x="0" y="178" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="12" fill="#4ade80">♪ Live Synced</text>
      <text x="90" y="178" font-family="'Segoe UI', system-ui, sans-serif"
            font-size="12" fill="#6b7280">  LRCLIB Stream</text>
    </g>


    <!-- ═══════════════════════════════════════ -->
    <!-- PLAYER CONTROLS BAR                     -->
    <!-- ═══════════════════════════════════════ -->
    <!-- Bar background -->
    <rect x="20" y="289" width="1240" height="54" rx="27"
          fill="url(#ctrl-bg)"
          stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

    <!-- Skip back -->
    <g transform="translate(48, 305)">
      <polygon points="18,11 4,0 4,22" fill="#6b7280"/>
      <rect x="0" y="0" width="3" height="22" rx="1.5" fill="#6b7280"/>
    </g>

    <!-- Play button -->
    <circle cx="98" cy="316" r="19" fill="url(#play-btn)"/>
    <polygon points="93,308 93,324 109,316" fill="#ffffff"/>

    <!-- Skip forward -->
    <g transform="translate(118, 305)">
      <polygon points="0,11 14,0 14,22" fill="#6b7280"/>
      <rect x="15" y="0" width="3" height="22" rx="1.5" fill="#6b7280"/>
    </g>

    <!-- Spinning album mini disc -->
    <circle cx="162" cy="316" r="15" fill="#0d0d28" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="162" cy="316" rx="11" ry="4"
             fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.8"
             transform="rotate(-18,162,316)"/>
    <circle cx="162" cy="316" r="3.5" fill="#7c3aed" opacity="0.6"/>

    <!-- Track name + source -->
    <text x="184" y="312" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#ffffff">Sonoglow</text>
    <text x="184" y="327" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="11.5" fill="#6b7280">YouTube Music</text>

    <!-- Heart icon -->
    <text x="296" y="321" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="15" fill="#4b5563">♡</text>

    <!-- Time elapsed -->
    <text x="324" y="321" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="12" fill="#9ca3af">1:12</text>

    <!-- Progress bar track -->
    <rect x="360" y="312" width="740" height="5" rx="2.5" fill="#2d3148"/>
    <!-- Progress fill -->
    <rect x="360" y="312" width="222" height="5" rx="2.5" fill="url(#prog)"/>
    <!-- Thumb dot -->
    <circle cx="582" cy="314.5" r="7" fill="#a78bfa"/>
    <circle cx="582" cy="314.5" r="4" fill="#ffffff"/>

    <!-- Duration -->
    <text x="1112" y="321" font-family="'Segoe UI', system-ui, sans-serif"
          font-size="12" fill="#9ca3af">3:45</text>

    <!-- Waveform icon -->
    <g transform="translate(1150, 306)" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round">
      <line x1="0"  y1="9"  x2="0"  y2="13"/>
      <line x1="5"  y1="5"  x2="5"  y2="17"/>
      <line x1="10" y1="7"  x2="10" y2="15"/>
      <line x1="15" y1="10" x2="15" y2="12"/>
      <line x1="20" y1="6"  x2="20" y2="16"/>
    </g>

    <!-- Fullscreen icon -->
    <g transform="translate(1188, 307)" stroke="#6b7280" stroke-width="1.8"
       stroke-linecap="round" fill="none">
      <polyline points="0,5 0,0 5,0"/>
      <polyline points="16,5 16,0 11,0"/>
      <polyline points="0,16 0,21 5,21"/>
      <polyline points="16,16 16,21 11,21"/>
    </g>

    <!-- ═══ BORDER GLOW ═══ -->
    <rect width="1280" height="360" rx="14" fill="none"
          stroke="#7c3aed" stroke-width="1" stroke-opacity="0.20"/>

  </g>
</svg>
