<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <!-- Deep cosmic background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#05060e"/>
      <stop offset="30%"  stop-color="#0c0e1f"/>
      <stop offset="65%"  stop-color="#1a1035"/>
      <stop offset="100%" stop-color="#3d1545"/>
    </linearGradient>

    <!-- Right warm aurora glow -->
    <radialGradient id="aurora-right" cx="85%" cy="55%" r="48%">
      <stop offset="0%"   stop-color="#ff9a6c" stop-opacity="0.42"/>
      <stop offset="40%"  stop-color="#d4a0f5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff9a6c" stop-opacity="0"/>
    </radialGradient>

    <!-- Left subtle cool glow -->
    <radialGradient id="aurora-left" cx="10%" cy="40%" r="38%">
      <stop offset="0%"   stop-color="#3ecfde" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3ecfde" stop-opacity="0"/>
    </radialGradient>

    <!-- Center ambient pulse -->
    <radialGradient id="center-pulse" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#7c5cbf" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7c5cbf" stop-opacity="0"/>
    </radialGradient>

    <!-- Wordmark gradient fill -->
    <linearGradient id="wordmark-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e8deff"/>
      <stop offset="100%" stop-color="#c8b8f8"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff9a6c"/>
      <stop offset="60%"  stop-color="#ff6fa3"/>
      <stop offset="100%" stop-color="#ff6fa3" stop-opacity="0"/>
    </linearGradient>

    <!-- EQ bar glow filter -->
    <filter id="eq-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Star glow filter -->
    <filter id="star-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip to rounded rect -->
    <clipPath id="round-clip">
      <rect width="1280" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round-clip)">

    <!-- === BACKGROUND LAYERS === -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#aurora-right)"/>
    <rect width="1280" height="360" fill="url(#aurora-left)"/>
    <rect width="1280" height="360" fill="url(#center-pulse)"/>

    <!-- === STAR FIELD === -->
    <g filter="url(#star-glow)" opacity="0.75">
      <!-- small stars -->
      <circle cx="420"  cy="32"  r="1.1" fill="#fff" opacity="0.7"/>
      <circle cx="610"  cy="18"  r="0.9" fill="#fff" opacity="0.6"/>
      <circle cx="750"  cy="55"  r="1.3" fill="#fff" opacity="0.8"/>
      <circle cx="870"  cy="28"  r="0.8" fill="#fff" opacity="0.5"/>
      <circle cx="1020" cy="48"  r="1.2" fill="#fff" opacity="0.7"/>
      <circle cx="1150" cy="22"  r="1.0" fill="#fff" opacity="0.6"/>
      <circle cx="1240" cy="70"  r="0.9" fill="#fff" opacity="0.5"/>
      <circle cx="500"  cy="80"  r="0.7" fill="#d4c8ff" opacity="0.6"/>
      <circle cx="680"  cy="300" r="0.8" fill="#fff" opacity="0.4"/>
      <circle cx="820"  cy="320" r="1.0" fill="#fff" opacity="0.5"/>
      <circle cx="950"  cy="295" r="0.7" fill="#d4c8ff" opacity="0.4"/>
      <circle cx="1100" cy="310" r="0.9" fill="#fff" opacity="0.5"/>
      <circle cx="1210" cy="280" r="1.1" fill="#fff" opacity="0.6"/>
      <circle cx="390"  cy="340" r="0.8" fill="#fff" opacity="0.3"/>
      <!-- accent coloured stars -->
      <circle cx="780"  cy="40"  r="1.4" fill="#9bd9dc" opacity="0.65"/>
      <circle cx="1060" cy="60"  r="1.1" fill="#ffba9b" opacity="0.55"/>
      <circle cx="460"  cy="330" r="1.2" fill="#c5b1e7" opacity="0.5"/>
    </g>

    <!-- === SUBTLE HORIZONTAL SCAN LINES === -->
    <rect width="1280" height="360" fill="url(#bg)" opacity="0.04"
          style="background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 4px)"/>

    <!-- === RIGHT SIDE: EQ VISUALISER === -->
    <g filter="url(#eq-glow)">
      <!-- Glowing EQ bars (varied heights for rhythm feel) -->
      <g stroke-linecap="round" stroke-width="5.5">
        <line x1="942" y1="212" x2="942" y2="188" stroke="#c5b1e7" stroke-opacity="0.55"/>
        <line x1="962" y1="220" x2="962" y2="156" stroke="#c5b1e7" stroke-opacity="0.65"/>
        <line x1="982" y1="228" x2="982" y2="132" stroke="#d4c0f8" stroke-opacity="0.75"/>
        <line x1="1002" y1="218" x2="1002" y2="162" stroke="#d4c0f8" stroke-opacity="0.70"/>
        <line x1="1022" y1="232" x2="1022" y2="108" stroke="#e8d5ff" stroke-opacity="0.80"/>
        <line x1="1042" y1="222" x2="1042" y2="138" stroke="#e8d5ff" stroke-opacity="0.75"/>
        <line x1="1062" y1="226" x2="1062" y2="154" stroke="#d4c0f8" stroke-opacity="0.70"/>
        <line x1="1082" y1="215" x2="1082" y2="175" stroke="#c5b1e7" stroke-opacity="0.60"/>
        <line x1="1102" y1="220" x2="1102" y2="185" stroke="#c5b1e7" stroke-opacity="0.50"/>
      </g>
      <!-- Soft reflection/mirror of EQ bars below (dim) -->
      <g stroke-linecap="round" stroke-width="5.5" opacity="0.18">
        <line x1="942" y1="238" x2="942" y2="250" stroke="#c5b1e7"/>
        <line x1="962" y1="238" x2="962" y2="264" stroke="#c5b1e7"/>
        <line x1="982" y1="238" x2="982" y2="274" stroke="#d4c0f8"/>
        <line x1="1002" y1="238" x2="1002" y2="268" stroke="#d4c0f8"/>
        <line x1="1022" y1="238" x2="1022" y2="282" stroke="#e8d5ff"/>
        <line x1="1042" y1="238" x2="1042" y2="272" stroke="#e8d5ff"/>
        <line x1="1062" y1="238" x2="1062" y2="266" stroke="#d4c0f8"/>
        <line x1="1082" y1="238" x2="1082" y2="254" stroke="#c5b1e7"/>
        <line x1="1102" y1="238" x2="1102" y2="248" stroke="#c5b1e7"/>
      </g>
    </g>

    <!-- === DECORATIVE RING ARC (right side) === -->
    <circle cx="1130" cy="180" r="108"
            fill="none"
            stroke="#c5b1e7"
            stroke-width="0.8"
            stroke-opacity="0.18"
            stroke-dasharray="6 10"/>
    <circle cx="1130" cy="180" r="148"
            fill="none"
            stroke="#ffba9b"
            stroke-width="0.6"
            stroke-opacity="0.10"
            stroke-dasharray="3 16"/>

    <!-- === VERTICAL DIVIDER LINE === -->
    <line x1="880" y1="95" x2="880" y2="265"
          stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- === LEFT SIDE: BRANDING === -->
    <g transform="translate(78, 0)">

      <!-- Tagline pill background -->
      <rect x="-2" y="84" width="262" height="26" rx="13"
            fill="#9bd9dc" fill-opacity="0.10"/>

      <!-- Tagline text -->
      <text x="10" y="102"
            font-family="'Segoe UI', -apple-system, sans-serif"
            font-size="12.5" font-weight="700" letter-spacing="3.5"
            fill="#9bd9dc">YOUR MUSIC. YOUR ATMOSPHERE.</text>

      <!-- Wordmark "Sonoglow" -->
      <text x="-5" y="214"
            font-family="'Segoe UI', Georgia, -apple-system, sans-serif"
            font-size="106" font-weight="200" letter-spacing="-4"
            fill="url(#wordmark-grad)">Sonoglow</text>

      <!-- Subtitle -->
      <text x="2" y="272"
            font-family="'Segoe UI', -apple-system, sans-serif"
            font-size="21" font-weight="400" letter-spacing="0.3"
            fill="#c5b1e7" opacity="0.90">An immersive music player for Windows.</text>

      <!-- Accent underline (gradient) -->
      <path d="M2 300 h160"
            stroke="url(#accent-line)"
            stroke-width="3" stroke-linecap="round"/>

      <!-- Badge: Open Source -->
      <g transform="translate(0, 318)">
        <rect width="108" height="22" rx="11" fill="#ffffff" fill-opacity="0.07"/>
        <text x="12" y="15.5"
              font-family="'Segoe UI', -apple-system, sans-serif"
              font-size="11" font-weight="600" letter-spacing="0.5"
              fill="#9bd9dc">⚡ Open Source</text>
      </g>
      <g transform="translate(120, 318)">
        <rect width="114" height="22" rx="11" fill="#ffffff" fill-opacity="0.07"/>
        <text x="12" y="15.5"
              font-family="'Segoe UI', -apple-system, sans-serif"
              font-size="11" font-weight="600" letter-spacing="0.5"
              fill="#ffba9b">🎵 YouTube Music</text>
      </g>
      <g transform="translate(246, 318)">
        <rect width="100" height="22" rx="11" fill="#ffffff" fill-opacity="0.07"/>
        <text x="12" y="15.5"
              font-family="'Segoe UI', -apple-system, sans-serif"
              font-size="11" font-weight="600" letter-spacing="0.5"
              fill="#e8d5ff">🖥 Windows 10/11</text>
      </g>

    </g>

    <!-- === BORDER GLOW (inner stroke) === -->
    <rect width="1280" height="360" rx="22"
          fill="none"
          stroke="url(#wordmark-grad)"
          stroke-width="1"
          stroke-opacity="0.14"/>

  </g>
</svg>
