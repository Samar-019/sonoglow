<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="45%" stop-color="#121324"/>
      <stop offset="75%" stop-color="#241a38"/>
      <stop offset="100%" stop-color="#4a223e"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffba9b" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c5b1e7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffba9b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="360" rx="26" fill="url(#bg)"/>

  <!-- Atmospheric Glow Aura -->
  <ellipse cx="1030" cy="200" rx="380" ry="260" fill="url(#glow)"/>

  <!-- Ambient Soundwave Equalizer Bars -->
  <g stroke="#f3d9da" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <path d="M985 169v22m20-48v74m20-96v118m20-82v46m20-106v166m20-130v94m20-59v24"/>
  </g>

  <!-- Left Side: Branding & Typography -->
  <g transform="translate(80, 0)">
    <!-- Small Category Pill -->
    <text x="0" y="106" font-family="'Plus Jakarta Sans', Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#9bd9dc">YOUR MUSIC. YOUR ATMOSPHERE.</text>
    
    <!-- Wordmark Sonoglow -->
    <text x="-4" y="216" font-family="'Plus Jakarta Sans', Segoe UI, -apple-system, sans-serif" font-size="104" font-weight="300" letter-spacing="-3" fill="#ffffff">Sonoglow</text>
    
    <!-- Subtitle -->
    <text x="2" y="278" font-family="'Plus Jakarta Sans', Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#c5b1e7">An immersive music player for Windows.</text>
    
    <!-- Radiant Accent Line -->
    <path d="M2 308h138" stroke="#ffba9b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
